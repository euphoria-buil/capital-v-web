
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiénes somos | Euphoria Roleplay</title>
    <link rel="stylesheet" href="equipo.css">
    <script src="equipo.js"></script>
</head>
<body>

<header class="pagina-equipo-header">
    <a href="index.html" class="equipo-logo">
        EUPHORIA ROLEPLAY
    </a>

    <nav class="pagina-equipo-nav">
        <a href="index.html">Inicio</a>
        <a href="index.html#tienda">Tienda</a>
        <a href="quienes-somos.html" class="activo">Quiénes somos</a>
        <a href="index.html#normativas">Normativas</a>
        <a href="index.html#contacto">Contacto</a>
    </nav>
</header>

<main>
    <section class="euphorya-equipo" id="equipo-euphorya">

        <div class="equipo-encabezado">
            <span class="equipo-etiqueta">EUPHORIA ROLEPLAY</span>
            <h1>Equipo de Euphoria</h1>
            <p>Conoce a quienes hacen posible nuestra comunidad.</p>
        </div>

        <div class="equipo-arbol">

            <div class="equipo-nivel-superior">
                <span class="equipo-corona">♛</span>
                <h2>Fundadores del proyecto</h2>
            </div>

            <div class="equipo-linea"></div>

            <!-- CUATRO FUNDADORES -->
            <div class="equipo-fundadores">

                <button type="button" class="equipo-persona"
                    data-nombre="Fundador 1"
                    data-rango="Fundador"
                    data-descripcion="Miembro fundador de Euphorya Roleplay.">
                    <span class="equipo-avatar">👤</span>
                    <strong>Fundador 1</strong>
                    <small>Fundador</small>
                </button>

                <button type="button" class="equipo-persona"
                    data-nombre="Fundador 2"
                    data-rango="Fundador"
                    data-descripcion="Miembro fundador de Euphorya Roleplay.">
                    <span class="equipo-avatar">👤</span>
                    <strong>Fundador 2</strong>
                    <small>Fundador</small>
                </button>

                <button type="button" class="equipo-persona"
                    data-nombre="Fundador 3"
                    data-rango="Fundador"
                    data-descripcion="Miembro fundador de Euphorya Roleplay.">
                    <span class="equipo-avatar">👤</span>
                    <strong>Fundador 3</strong>
                    <small>Fundador</small>
                </button>

                <button type="button" class="equipo-persona"
                    data-nombre="Fundador 4"
                    data-rango="Fundador"
                    data-descripcion="Miembro fundador de Euphorya Roleplay.">
                    <span class="equipo-avatar">👤</span>
                    <strong>Fundador 4</strong>
                    <small>Fundador</small>
                </button>

            </div>

            <div class="equipo-linea"></div>

            <!-- ADMINISTRADORES -->
            <button type="button" class="equipo-rango"
                data-nombre="Administradores"
                data-rango="Administración"
                data-descripcion="Responsables de gestionar el servidor y la comunidad.">
                <span>🛡️</span>
                <strong>Administradores</strong>
            </button>

            <div class="equipo-linea"></div>

            <!-- MODERADORES -->
            <button type="button" class="equipo-rango"
                data-nombre="Moderadores"
                data-rango="Moderación"
                data-descripcion="Supervisan el cumplimiento de las normas.">
                <span>⚖️</span>
                <strong>Moderadores</strong>
            </button>

            <div class="equipo-linea"></div>

            <!-- SOPORTE -->
            <button type="button" class="equipo-rango"
                data-nombre="Soporte"
                data-rango="Soporte"
                data-descripcion="Ayudan a los jugadores y resuelven sus dudas.">
                <span>🎧</span>
                <strong>Soporte</strong>
            </button>

        </div>

        <!-- INFORMACIÓN INTERACTIVA -->
        <div class="equipo-informacion" aria-live="polite">
            <span>ℹ️</span>
            <div>
                <strong id="equipoNombre">Selecciona un integrante</strong>
                <p id="equipoDescripcion">
                    Haz clic en una tarjeta para conocer su información.
                </p>
            </div>
        </div>

    </section>
</main>

<script src="equipo.js"></script>
</body>
</html>
