# Host nginx reverse-proxy. Copy to /etc/nginx/sites-available/capitalv.me
# Certbot will add listen 443 ssl after the first issue.

upstream capitalv_web {
    server 127.0.0.1:8088;
}

server {
    listen 80;
    listen [::]:80;
    server_name capitalv.me www.capitalv.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://capitalv_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
