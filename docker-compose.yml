name: capitalv-web

services:
  web:
    build: .
    image: capitalv-web:latest
    container_name: capitalv-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
